
name: Build RusTalk Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip RusTalk_starter.zip

      - name: Generate Android project
        working-directory: RusTalk/client
        run: flutter create . --platforms=android

      - name: Install dependencies
        working-directory: RusTalk/client
        run: flutter pub get

      - name: Build APK
        working-directory: RusTalk/client
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RusTalk-Android
          path: RusTalk/client/build/app/outputs/flutter-apk/app-debug.apk
